    <script>
        // Configuration
        const CONFIG = {
            albumFolders: ['decor', 'album1', 'album2', 'album3', 'album4', 'album5'],
            albumNames: {
                'decor': '✨ الديكورات',
                'album1': '📸 جلسات تصوير',
                'album2': '📸 أعراس',
                'album3': '📸 ألبوم 3',
                'album4': '📸 ألبوم 4',
                'album5': '📸 ألبوم 5'
            },
            imageExtensions: ['.jpg', '.jpeg', '.webp', '.png'],
            maxImagesPerAlbum: 100
        };

        let lightboxImages = [];
        let currentImageIndex = 0;

        // Test image source with multiple extensions
        async function testImageSrc(basePath) {
            for (const ext of CONFIG.imageExtensions) {
                try {
                    const response = await fetch(basePath + ext, { method: 'HEAD' });
                    if (response.ok) return basePath + ext;
                } catch (e) {}
            }
            return null;
        }

        // Scan album for images
        async function scanAlbum(folderName) {
            const images = [];
            const promises = [];

            for (let i = 1; i <= CONFIG.maxImagesPerAlbum; i++) {
                promises.push(
                    testImageSrc(`./${folderName}/${i}`).then(src => {
                        if (src) images.push({ src, index: i });
                    })
                );
            }

            await Promise.all(promises);
            return images.sort((a, b) => a.index - b.index);
        }

        // Scan all albums in parallel
        async function scanAllAlbums() {
            const albumsData = await Promise.all(
                CONFIG.albumFolders.map(async (folder) => {
                    const images = await scanAlbum(folder);
                    return { folder, images, name: CONFIG.albumNames[folder] || folder };
                })
            );
            return albumsData.filter(album => album.images.length > 0);
        }

        // Create skeleton loader - Vertical 4:5
        function createSkeleton() {
            return `
                <div class="w-64 h-80 md:w-72 md:h-90 flex-shrink-0 rounded-2xl shimmer"></div>
            `;
        }

        // Create image card - Vertical 4:5 ratio
        function createImageCard(image, albumIndex, imgIndex) {
            return `
                <div class="w-64 h-80 md:w-72 md:h-90 flex-shrink-0 rounded-2xl overflow-hidden bg-[#f5f3f0] backdrop-blur-sm cursor-pointer group transition-all duration-300 hover:scale-105 hover:shadow-2xl hover:ring-1 hover:ring-[#c5a880]/30"
                     onclick="openLightbox(${albumIndex}, ${imgIndex})">
                    <img src="${image.src}"
                         alt=""
                         class="w-full h-full object-contain fade-in"
                         onerror="handleImageError(this)"
                         draggable="false">
                </div>
            `;
        }

        // Handle image error
        function handleImageError(img) {
            img.style.display = 'none';
        }

        // Setup infinite scroll with inertia
        function setupInfiniteScroll(container, images, albumIndex) {
            const tripleImages = [...images,...images,...images];
            container.innerHTML = tripleImages.map((img, idx) =>
                createImageCard(img, albumIndex, idx % images.length)
            ).join('');

            let isDown = false;
            let startX;
            let scrollLeft;
            let velocity = 0;
            let lastX = 0;
            let lastTime = 0;
            let animationId;

            const scrollToMiddle = () => {
                const itemWidth = container.children[0].offsetWidth + 16;
                container.scrollLeft = itemWidth * images.length;
            };

            setTimeout(scrollToMiddle, 100);

            container.addEventListener('mousedown', (e) => {
                isDown = true;
                startX = e.pageX - container.offsetLeft;
                scrollLeft = container.scrollLeft;
                lastX = e.pageX;
                lastTime = Date.now();
                cancelAnimationFrame(animationId);
            });

            container.addEventListener('mouseleave', () => isDown = false);
            container.addEventListener('mouseup', () => {
                isDown = false;
                // Inertia
                const animate = () => {
                    velocity *= 0.95;
                    container.scrollLeft += velocity;
                    if (Math.abs(velocity) > 0.5) {
                        animationId = requestAnimationFrame(animate);
                    }
                    checkInfiniteLoop();
                };
                animate();
            });

            container.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - container.offsetLeft;
                const walk = (x - startX) * 2;
                container.scrollLeft = scrollLeft - walk;

                const now = Date.now();
                const dt = now - lastTime;
                if (dt > 0) {
                    velocity = (lastX - e.pageX) / dt * 16;
                    lastX = e.pageX;
                    lastTime = now;
                }
            });

            // Touch events
            container.addEventListener('touchstart', (e) => {
                isDown = true;
                startX = e.touches[0].pageX - container.offsetLeft;
                scrollLeft = container.scrollLeft;
                cancelAnimationFrame(animationId);
            });

            container.addEventListener('touchend', () => {
                isDown = false;
            });

            container.addEventListener('touchmove', (e) => {
                if (!isDown) return;
                const x = e.touches[0].pageX - container.offsetLeft;
                const walk = (x - startX) * 2;
                container.scrollLeft = scrollLeft - walk;
                checkInfiniteLoop();
            });

            const checkInfiniteLoop = () => {
                const itemWidth = container.children[0].offsetWidth + 16;
                const totalWidth = itemWidth * images.length;

                if (container.scrollLeft <= itemWidth) {
                    container.scrollLeft += totalWidth;
                } else if (container.scrollLeft >= totalWidth * 2 - itemWidth) {
                    container.scrollLeft -= totalWidth;
                }
            };

            container.addEventListener('scroll', checkInfiniteLoop);
        }

        // Render albums
        async function renderAlbums() {
            const container = document.getElementById('albumsContainer');
            const tabsContainer = document.getElementById('tabsContainer');

            // Show skeletons
            container.innerHTML = Array(3).fill(0).map(() => `
                <div class="space-y-6">
                    <div class="h-10 w-48 shimmer rounded-lg"></div>
                    <div class="flex gap-4 overflow-x-auto no-scrollbar">
                        ${Array(5).fill(0).map(() => createSkeleton()).join('')}
                    </div>
                </div>
            `).join('');

            const albums = await scanAllAlbums();

            // Render tabs
            tabsContainer.innerHTML = albums.map((album, idx) => `
                <button onclick="scrollToAlbum(${idx})"
                        class="tab-btn whitespace-nowrap px-4 py-2 text-lg font-semibold transition-all duration-300 hover:text-[#c5a880] border-b-2 border-transparent"
                        data-album="${idx}">
                    ${album.name}
                </button>
            `).join('');

            // Render albums
            container.innerHTML = albums.map((album, albumIdx) => `
                <section id="album-${albumIdx}" class="album-section space-y-6">
                    <h2 class="text-3xl md:text-4xl font-bold text-[#1a1a1a]">${album.name}</h2>
                    <div id="carousel-${albumIdx}" class="flex gap-4 overflow-x-auto no-scrollbar pb-4 cursor-grab active:cursor-grabbing">
                    </div>
                </section>
            `).join('');

            // Setup carousels
            albums.forEach((album, idx) => {
                const carousel = document.getElementById(`carousel-${idx}`);
                setupInfiniteScroll(carousel, album.images, idx);
            });

            // Store for lightbox
            window.albumsData = albums;

            // Show tabs after hero
            const observer = new IntersectionObserver((entries) => {
                const tabs = document.getElementById('floatingTabs');
                if (!entries[0].isIntersecting) {
                    tabs.classList.remove('opacity-0', 'invisible');
                } else {
                    tabs.classList.add('opacity-0', 'invisible');
                }
            });
            observer.observe(document.querySelector('section'));

            // Update active tab on scroll
            const sectionObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const idx = entry.target.id.split('-')[1];
                        document.querySelectorAll('.tab-btn').forEach(btn => {
                            btn.classList.remove('text-[#c5a880]', 'border-[#c5a880]');
                        });
                        document.querySelector(`.tab-btn[data-album="${idx}"]`)?.classList.add('text-[#c5a880]', 'border-[#c5a880]');
                    }
                });
            }, { threshold: 0.5 });

            document.querySelectorAll('.album-section').forEach(section => {
                sectionObserver.observe(section);
            });
        }

        // Scroll to album
        function scrollToAlbum(idx) {
            document.getElementById(`album-${idx}`).scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Lightbox functions
        function openLightbox(albumIdx, imgIdx) {
            const album = window.albumsData[albumIdx];
            lightboxImages = album.images;
            currentImageIndex = imgIdx;
            updateLightboxImage();
            document.getElementById('lightbox').classList.remove('hidden');
            document.getElementById('lightbox').classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.add('hidden');
            document.getElementById('lightbox').classList.remove('flex');
            document.body.style.overflow = '';
        }

        function updateLightboxImage() {
            document.getElementById('lightboxImg').src = lightboxImages[currentImageIndex].src;
        }

        function nextImage() {
            currentImageIndex = (currentImageIndex + 1) % lightboxImages.length;
            updateLightboxImage();
        }

        function prevImage() {
            currentImageIndex = (currentImageIndex - 1 + lightboxImages.length) % lightboxImages.length;
            updateLightboxImage();
        }

        // Event listeners
        document.getElementById('closeLightbox').addEventListener('click', closeLightbox);
        document.getElementById('nextBtn').addEventListener('click', nextImage);
        document.getElementById('prevBtn').addEventListener('click', prevImage);
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') closeLightbox();
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('lightbox').classList.contains('hidden')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') nextImage();
            if (e.key === 'ArrowLeft') prevImage();
        });

        // Touch swipe for lightbox
        let touchStartX = 0;
        document.getElementById('lightbox').addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
        });
        document.getElementById('lightbox').addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].clientX;
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) nextImage();
                else prevImage();
            }
        });

        // Header scroll effect
        window.addEventListener('scroll', () => {
            const header = document.getElementById('header');
            if (window.scrollY > 100) {
                header.classList.add('shadow-lg');
            } else {
                header.classList.remove('shadow-lg');
            }
        });

        // Initialize
        renderAlbums();
    </script>
</body>
</html>
