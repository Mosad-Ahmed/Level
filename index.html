<script>
// Config
const ALBUMS = [
    { folder: 'decor', name: '✨ الديكورات', maxImages: 55 },
    { folder: 'album1', name: '📸 جلسات 1', maxImages: 100 },
    { folder: 'album3', name: '📸 جلسات 3', maxImages: 100 }
];

const EXTENSIONS = ['.jpg', '.jpeg'];
let allImages = {};
let currentLightboxAlbum = null;
let currentLightboxIndex = 0;

// Test image source with fallback extensions
function testImageSrc(folder, num) {
    return new Promise((resolve) => {
        let extIndex = 0;
        const tryNext = () => {
            if (extIndex >= EXTENSIONS.length) return resolve(null);
            const img = new Image();
            const src = `${folder}/${num}${EXTENSIONS[extIndex]}`;
            img.onload = () => resolve(src);
            img.onerror = () => { extIndex++; tryNext(); };
            img.src = src;
        };
        tryNext();
    });
}

// Handle image error - hide parent card
function handleImageError(img) {
    const card = img.closest('.album-card');
    if (card) card.style.display = 'none';
}

// Discover albums in parallel
async function discoverAlbums() {
    const results = await Promise.all(ALBUMS.map(async (album) => {
        const images = [];
        const promises = [];
        for (let i = 1; i <= album.maxImages; i++) {
            promises.push(testImageSrc(album.folder, i));
        }
        const srcs = await Promise.all(promises);
        srcs.forEach(src => { if (src) images.push(src); });
        return {...album, images };
    }));

    // Filter empty albums
    return results.filter(album => album.images.length > 0);
}

// Render album section
function renderAlbum(album) {
    const section = document.createElement('section');
    section.id = `album-${album.folder}`;
    section.className = 'album-section';

    section.innerHTML = `
        <h2 class="text-3xl font-bold mb-6 text-[#1a1a1a]">${album.name}</h2>
        <div class="relative">
            <div class="carousel-container overflow-x-auto no-scrollbar cursor-grab active:cursor-grabbing" data-folder="${album.folder}">
                <div class="carousel-track flex gap-4 pb-4"></div>
            </div>
        </div>
    `;

    const track = section.querySelector('.carousel-track');

    // Triple the images for infinite effect
    const images = [...album.images,...album.images,...album.images];
    images.forEach((src, idx) => {
        const card = document.createElement('div');
        card.className = 'album-card flex-shrink-0 w-64 md:w-80 aspect-[2/3] bg-[#f5f3f0] rounded-xl overflow-hidden shadow-lg hover:scale-105 hover:shadow-2xl hover:ring-1 hover:ring-[#c5a880]/30 transition-all duration-300 cursor-pointer';
        card.innerHTML = `
            <div class="w-full h-full bg-[#fcfbf9] backdrop-blur-sm flex items-center justify-center p-2">
                <img src="${src}" alt="" class="max-w-full max-h-full object-contain fade-in" draggable="false" onerror="handleImageError(this)">
            </div>
        `;
        card.onclick = () => openLightbox(album.folder, idx % album.images.length);
        track.appendChild(card);
    });

    document.getElementById('albums-container').appendChild(section);
    setupInfiniteCarousel(section.querySelector('.carousel-container'), album.images.length);
}

// Setup infinite carousel with inertia drag
function setupInfiniteCarousel(container, originalLength) {
    const track = container.querySelector('.carousel-track');
    let isDown = false;
    let startX, scrollLeft, velocity = 0, lastX, lastTime;
    let animationId;

    // Jump to middle on load
    setTimeout(() => {
        const itemWidth = track.children[0].offsetWidth + 16;
        container.scrollLeft = itemWidth * originalLength;
    }, 100);

    // Infinite scroll logic
    container.addEventListener('scroll', () => {
        const itemWidth = track.children[0].offsetWidth + 16;
        const maxScroll = itemWidth * originalLength;
        const minScroll = itemWidth * (originalLength - 1);

        if (container.scrollLeft <= minScroll) {
            container.scrollLeft += maxScroll;
        } else if (container.scrollLeft >= maxScroll * 2) {
            container.scrollLeft -= maxScroll;
        }
    });

    // Mouse/Touch drag with inertia
    const startDrag = (e) => {
        isDown = true;
        container.classList.add('cursor-grabbing');
        startX = (e.pageX || e.touches[0].pageX) - container.offsetLeft;
        scrollLeft = container.scrollLeft;
        lastX = startX;
        lastTime = Date.now();
        velocity = 0;
        if (animationId) cancelAnimationFrame(animationId);
    };

    const moveDrag = (e) => {
        if (!isDown) return;
        e.preventDefault();
        const x = (e.pageX || e.touches[0].pageX) - container.offsetLeft;
        const walk = (x - startX) * 2;
        container.scrollLeft = scrollLeft - walk;

        // Calculate velocity
        const now = Date.now();
        const dt = now - lastTime;
        if (dt > 0) {
            velocity = (lastX - x) / dt * 16;
            lastX = x;
            lastTime = now;
        }
    };

    const endDrag = () => {
        isDown = false;
        container.classList.remove('cursor-grabbing');

        // Inertia animation
        const inertia = () => {
            if (Math.abs(velocity) < 0.5) return;
            container.scrollLeft += velocity;
            velocity *= 0.95;
            animationId = requestAnimationFrame(inertia);
        };
        inertia();
    };

    container.addEventListener('mousedown', startDrag);
    container.addEventListener('mousemove', moveDrag);
    container.addEventListener('mouseup', endDrag);
    container.addEventListener('mouseleave', endDrag);
    container.addEventListener('touchstart', startDrag);
    container.addEventListener('touchmove', moveDrag);
    container.addEventListener('touchend', endDrag);
}

// Render tabs
function renderTabs(albums) {
    const tabsContainer = document.getElementById('tabs-container');
    albums.forEach((album, idx) => {
        const tab = document.createElement('button');
        tab.className = `tab relative text-sm md:text-base font-semibold whitespace-nowrap px-2 py-1 transition-colors duration-300 ${idx === 0? 'text-[#c5a880] active-tab' : 'text-gray-600 hover:text-[#c5a880]'}`;
        tab.textContent = album.name;
        tab.onclick = () => {
            document.getElementById(`album-${album.folder}`).scrollIntoView({ behavior: 'smooth', block: 'start' });
            updateActiveTab(tab);
        };
        tabsContainer.appendChild(tab);
    });
}

// Update active tab
function updateActiveTab(activeTab) {
    document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.remove('text-[#c5a880]', 'active-tab');
        tab.classList.add('text-gray-600');
    });
    activeTab.classList.remove('text-gray-600');
    activeTab.classList.add('text-[#c5a880]', 'active-tab');
}

// Lightbox functions
function openLightbox(folder, index) {
    currentLightboxAlbum = folder;
    currentLightboxIndex = index;
    const album = allImages[folder];
    document.getElementById('lightbox-img').src = album.images[index];
    document.getElementById('lightbox').classList.remove('hidden');
    document.getElementById('lightbox').classList.add('flex');
    document.body.style.overflow = 'hidden';
}

function closeLightbox() {
    document.getElementById('lightbox').classList.add('hidden');
    document.getElementById('lightbox').classList.remove('flex');
    document.body.style.overflow = '';
}

function navigateLightbox(direction) {
    const album = allImages[currentLightboxAlbum];
    currentLightboxIndex = (currentLightboxIndex + direction + album.images.length) % album.images.length;
    document.getElementById('lightbox-img').src = album.images[currentLightboxIndex];
}

// Lightbox events
document.getElementById('lightbox-close').onclick = closeLightbox;
document.getElementById('lightbox-prev').onclick = () => navigateLightbox(-1);
document.getElementById('lightbox-next').onclick = () => navigateLightbox(1);
document.getElementById('lightbox').onclick = (e) => {
    if (e.target.id === 'lightbox') closeLightbox();
};

// Keyboard navigation
document.addEventListener('keydown', (e) => {
    const lightbox = document.getElementById('lightbox');
    if (!lightbox.classList.contains('hidden')) {
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') navigateLightbox(-1);
        if (e.key === 'ArrowRight') navigateLightbox(1);
    }
});

// Touch swipe for lightbox
let touchStartX = 0;
document.getElementById('lightbox').addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
});
document.getElementById('lightbox').addEventListener('touchend', (e) => {
    const touchEndX = e.changedTouches[0].clientX;
    const diff = touchStartX - touchEndX;
    if (Math.abs(diff) > 50) {
        navigateLightbox(diff > 0? 1 : -1);
    }
});

// Prevent pinch zoom
document.addEventListener('touchmove', (e) => {
    if (e.scale!== 1) e.preventDefault();
}, { passive: false });

// Scroll spy for tabs
function setupScrollSpy() {
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const folder = entry.target.id.replace('album-', '');
                const tab = Array.from(document.querySelectorAll('.tab')).find(t =>
                    t.textContent.includes(allImages[folder].name.replace(/✨|📸/g, '').trim())
                );
                if (tab) updateActiveTab(tab);
            }
        });
    }, { threshold: 0.3, rootMargin: '-100px 0px -50% 0px' });

    document.querySelectorAll('.album-section').forEach(section => observer.observe(section));
}

// Show/hide floating tabs on scroll
window.addEventListener('scroll', () => {
    const tabs = document.getElementById('floating-tabs');
    if (window.scrollY > window.innerHeight - 200) {
        tabs.style.opacity = '1';
    } else {
        tabs.style.opacity = '0';
    }
});

// Init
async function init() {
    const albums = await discoverAlbums();

    // Remove skeleton
    document.getElementById('skeleton').remove();

    if (albums.length === 0) {
        document.getElementById('albums-container').innerHTML = '<p class="text-center text-gray-500 py-20">لا توجد ألبومات متاحة حالياً</p>';
        return;
    }

    // Store in global
    albums.forEach(album => {
        allImages[album.folder] = album;
    });

    // Render
    albums.forEach(renderAlbum);
    renderTabs(albums);
    setupScrollSpy();
}

init();
</script>
